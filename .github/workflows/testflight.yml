name: TestFlight Release

# Auto-publishes every push to main to TestFlight. Requires 3 repo secrets
# (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID       — App Store Connect API Key ID
#   ASC_ISSUER_ID    — App Store Connect API Issuer ID
#   ASC_KEY_P8       — full contents of the AuthKey_<id>.p8 file
# These come from App Store Connect → Users and Access → Integrations →
# App Store Connect API (NOT an APNs key — different key, same portal family).
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Archive & upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    if: ${{ vars.SKIP_TESTFLIGHT != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout shared CrazyBeeLicense package
        # QualiScan/DualCam OxO/Menu Island/Record Seconds reference the
        # license-gate package via a local SPM package reference at
        # "../crazybee-license-kit" (a sibling directory locally) — clone it
        # to that exact relative path here so package resolution finds it.
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          KIT="$GITHUB_WORKSPACE/../crazybee-license-kit"
          git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/JeremyLNO/KitSwift.git" "$KIT"
          # Jeter le .git juste après : SwiftPM n'a besoin que des sources pour une
          # XCLocalSwiftPackageReference, et tant que le dossier reste un dépôt git, la
          # résolution peut y lancer un `git fetch`. Comme elle nettoie les identifiants
          # embarqués dans l'URL du remote, ce fetch part **sans jeton** sur un dépôt
          # privé : GitHub réclame alors un mot de passe et le job se fige sans un mot.
          # C'est ce qui a bloqué qualiscan, dualcam-oxo et record-seconds six heures le
          # 2026-09-14 — les trois seuls dépôts qui embarquent ce package local.
          rm -rf "$KIT/.git"

      - name: Select latest available Xcode
        # App Store Connect now rejects uploads built with an SDK older than
        # the current-year iOS SDK — the runner image's *default* Xcode lags
        # behind what's actually installed side-by-side on it.
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          # Without this, xcodebuild's automatic signing does not see the
          # identity we just imported and quietly mints a BRAND NEW "Apple
          # Development" certificate on every run, which exhausts the
          # account-wide certificate quota after a handful of builds and then
          # breaks archiving for every app on the account.
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"
          # Fail loudly rather than let the build "succeed" on a freshly
          # created certificate.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Development" || {
            echo "::error::imported certificate is not usable for code signing"
            exit 1
          }

      - name: Resolve Swift packages
        env:
          # Un git qui réclame des identifiants dans un runner n'a personne pour
          # répondre : il attend indéfiniment. Avec ça, il échoue et se nomme.
          GIT_TERMINAL_PROMPT: '0'
        # Résolu à part, avec son propre chrono. Une résolution qui se bloque
        # *dans* `xcodebuild archive` n'a aucun timeout à elle : le 2026-09-14,
        # trois dépôts sont restés figés juste après « Checking out 5.5.1 of
        # package OneSignal-XCFramework » et GitHub ne les a tués qu'au bout de
        # SIX heures. Ici, ça échoue en 10 minutes et ça se voit.
        timeout-minutes: 10
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DualCamOXO.xcodeproj \
            -scheme DualCamOXO

      - name: Archive (signed, automatic provisioning)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project DualCamOXO.xcodeproj \
            -scheme DualCamOXO \
            -disableAutomaticPackageResolution \
            -configuration Release \
            -archivePath build/DualCamOXO.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/DualCamOXO.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
