name: SPM debug (jetable)

# Localise le blocage de « Resolve Swift packages ».
# macOS n'a pas `timeout(1)` : chaque sonde utilise `limite N -- cmd` (shell pur).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le chrono et les paquets d'essai
        run: |
          cat > /tmp/limite <<'SH'
          #!/bin/bash
          # limite <secondes> -- <commande...>  → tue la commande si elle dépasse
          secs="$1"; shift; [ "$1" = "--" ] && shift
          "$@" & pid=$!
          ( sleep "$secs"; kill -0 $pid 2>/dev/null && { echo "!!! FIGÉ APRÈS ${secs}s — pile :"; sample $pid 4 -file /tmp/s.txt >/dev/null 2>&1; grep -iE "wait|Remote|git|socket|resolve|network" /tmp/s.txt | head -25; kill -9 $pid 2>/dev/null; } ) &
          watcher=$!
          wait $pid; rc=$?
          kill $watcher 2>/dev/null
          echo "→ code=$rc"
          SH
          chmod +x /tmp/limite
          mk() { # mk <dossier> <deps-swift>
            mkdir -p "$1/Sources/P"; echo "" > "$1/Sources/P/P.swift"
            cat > "$1/Package.swift" <<EOF
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(name: "P", platforms: [.iOS(.v17)],
            dependencies: [$2],
            targets: [.target(name: "P")])
          EOF
          }
          mk /tmp/only-kit '.package(url: "https://github.com/JeremyLNO/KitSwift.git", from: "1.0.0")'
          mk /tmp/only-onesignal '.package(url: "https://github.com/OneSignal/OneSignal-XCFramework", exact: "5.5.1")'
          mk /tmp/both '.package(url: "https://github.com/JeremyLNO/KitSwift.git", from: "1.0.0"), .package(url: "https://github.com/OneSignal/OneSignal-XCFramework", exact: "5.5.1")'

      - name: Réécriture d'URL (comme le vrai workflow)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"

      - name: A — KitSwift SEUL (SwiftPM)
        continue-on-error: true
        run: cd /tmp/only-kit && time /tmp/limite 90 -- swift package resolve 2>&1 | tail -20

      - name: B — OneSignal SEUL (SwiftPM)
        continue-on-error: true
        run: cd /tmp/only-onesignal && time /tmp/limite 180 -- swift package resolve 2>&1 | tail -20

      - name: C — les DEUX (SwiftPM)
        continue-on-error: true
        run: cd /tmp/both && time /tmp/limite 180 -- swift package resolve 2>&1 | tail -20

      - name: D — le vrai projet via xcodebuild
        continue-on-error: true
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); sudo xcode-select -s "$latest"
          time /tmp/limite 300 -- xcodebuild -resolvePackageDependencies \
            -project DualCamOXO.xcodeproj -scheme DualCamOXO \
            -clonedSourcePackagesDirPath /tmp/SP 2>&1 | tail -30
